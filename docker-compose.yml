# Contract Guard starter kit: frontend + backend + database + webhook receiver.
# Specs and consumer files remain plain files in this folder (not modified).
# Start:  docker compose up --build     (Podman: podman compose up --build)
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: "5000"
      DB_PATH: /data/contract-guard.db
      SPECS_DIR: /app/specs
      CONSUMERS_DIR: /app/consumers
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - backend-data:/data
      # Mount original starter-kit inputs read-only for folder import/seed
      - ./specs:/app/specs:ro
      - ./consumers:/app/consumers:ro
    depends_on:
      - webhook-receiver

  webhook-receiver:
    build: ./webhook-receiver
    environment: { PORT: "9000" }
    ports: ["${WEBHOOK_PORT:-9900}:9000"]  # host port: 9900 by default, override with WEBHOOK_PORT

volumes:
  backend-data:

